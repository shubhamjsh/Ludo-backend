server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # Ludo API logs
  - job_name: ludo-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: ludo-api
          app: ludo
          environment: development
          __path__: /app/logs/*.log